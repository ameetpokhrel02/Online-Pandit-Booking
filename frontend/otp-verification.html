<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - Book Pandit</title>
    <link rel="icon" type="image/png" href="images/logo/logo.png">
    <link rel="stylesheet" href="styles/styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/auth.js" defer></script>
</head>
<body class="modern-auth-body">
    <nav class="navbar">
        <!-- ...same as login.html... -->
    </nav>
    <main class="modern-auth-page">
        <div class="modern-auth-background">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="gradient-orb orb-3"></div>
        </div>
        <div class="container">
            <div class="modern-auth-container">
                <div class="modern-auth-split">
                    <div class="modern-auth-card">
                        <div class="auth-header">
                            <div class="auth-logo">
                                <div class="logo-glow"></div>
                                <span class="brand-name">BookPandit</span>
                            </div>
                            <h1 class="auth-title" data-i18n="otpVerification">OTP Verification</h1>
                            <p class="auth-subtitle" data-i18n="otpDesc">Enter the OTP sent to your email.</p>
                        </div>
                        <form class="modern-auth-form" id="otp-form">
                            <div class="modern-form-group">
                                <div class="otp-input-group">
                                    <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                                    <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                                    <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                                    <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                                    <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                                    <input type="text" class="otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" required>
                                </div>
                            </div>
                            <button type="submit" class="modern-login-btn">
                                <span data-i18n="verifyOtp">Verify OTP</span>
                            </button>
                            <div class="modern-auth-footer">
                                <a href="login.html" class="back-to-login" data-i18n="backToLogin">← Back to Login</a>
                            </div>
</head>
<style>
.otp-input-group {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 10px;
}
.otp-digit {
    width: 40px;
    height: 48px;
    font-size: 2rem;
    text-align: center;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    outline: none;
    transition: border 0.2s;
}
.otp-digit:focus {
    border: 2px solid #1976d2;
    background: #f0f7ff;
}
</style>
<script>
// Auto-focus next OTP box for better UX
document.addEventListener('DOMContentLoaded', function() {
    var inputs = document.querySelectorAll('.otp-digit');
    inputs.forEach((input, idx) => {
        input.addEventListener('input', function(e) {
            if (e.inputType === 'insertText' && input.value.length === 1 && idx < inputs.length - 1) {
                inputs[idx + 1].focus();
            }
            if (e.inputType === 'deleteContentBackward' && input.value.length === 0 && idx > 0) {
                inputs[idx - 1].focus();
            }
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && input.value === '' && idx > 0) {
                inputs[idx - 1].focus();
            }
        });
    });
});
</script>
                        </form>
                    </div>
                    <div class="modern-auth-visual">
                        <!-- ...same as login.html pagesotp... -->
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
