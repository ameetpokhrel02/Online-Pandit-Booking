<svg width="260" height="260" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="130" cy="130" r="130" fill="url(#gradient1)"/>
  
  <!-- Pandit Figure -->
  <g transform="translate(130, 130)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="35" fill="#8B4513"/>
    
    <!-- Turban -->
    <path d="M-35 -75 Q-40 -85 -35 -95 Q-30 -105 -25 -95 Q-20 -85 -25 -75 Q-30 -65 -35 -75 Z" fill="#FF6B00"/>
    <path d="M-25 -75 Q-20 -85 -15 -95 Q-10 -105 -5 -95 Q0 -85 -5 -75 Q-10 -65 -15 -75 Q-20 -65 -25 -75 Z" fill="#FF8E53"/>
    <path d="M-5 -75 Q0 -85 5 -95 Q10 -105 15 -95 Q20 -85 15 -75 Q10 -65 5 -75 Q0 -65 -5 -75 Z" fill="#FF6B00"/>
    <path d="M15 -75 Q20 -85 25 -95 Q30 -105 35 -95 Q40 -85 35 -75 Q30 -65 25 -75 Q20 -65 15 -75 Z" fill="#FF8E53"/>
    
    <!-- Face -->
    <circle cx="0" cy="-40" r="25" fill="#F4A460"/>
    
    <!-- Eyes -->
    <circle cx="-8" cy="-45" r="3" fill="#2C3E50"/>
    <circle cx="8" cy="-45" r="3" fill="#2C3E50"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="-35" rx="2" ry="4" fill="#8B4513"/>
    
    <!-- Mouth -->
    <path d="M-5 -25 Q0 -20 5 -25" stroke="#8B4513" stroke-width="2" fill="none"/>
    
    <!-- Beard -->
    <path d="M-15 -15 Q-10 -5 -5 -15 Q0 -5 5 -15 Q10 -5 15 -15" fill="#8B4513"/>
    
    <!-- Body -->
    <rect x="-25" y="-5" width="50" height="60" rx="10" fill="#FF6B00"/>
    
    <!-- Arms -->
    <rect x="-35" y="0" width="15" height="40" rx="7" fill="#FF8E53"/>
    <rect x="20" y="0" width="15" height="40" rx="7" fill="#FF8E53"/>
    
    <!-- Hands -->
    <circle cx="-30" cy="45" r="8" fill="#F4A460"/>
    <circle cx="30" cy="45" r="8" fill="#F4A460"/>
    
    <!-- Traditional Markings -->
    <circle cx="0" cy="-30" r="2" fill="#FFD700"/>
    <circle cx="-10" cy="-30" r="2" fill="#FFD700"/>
    <circle cx="10" cy="-30" r="2" fill="#FFD700"/>
    
    <!-- Necklace -->
    <ellipse cx="0" cy="-10" rx="20" ry="5" fill="#FFD700" opacity="0.8"/>
    
    <!-- Blessing Gesture -->
    <path d="M25 20 Q35 10 45 20 Q35 30 25 20" fill="#FFD700"/>
    <circle cx="35" cy="15" r="3" fill="#FF6B00"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="8" fill="#FFD700" opacity="0.6"/>
  <circle cx="210" cy="80" r="6" fill="#FF8E53" opacity="0.7"/>
  <circle cx="180" cy="200" r="10" fill="#FF6B00" opacity="0.5"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8E53;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F39C12;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg> 