<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Book Pandit</title>
    <link rel="icon" type="image/png" href="images/logo/logo.png">
    <link rel="stylesheet" href="styles/styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/auth.js" defer></script>
</head>
<body class="modern-auth-body">
    <nav class="navbar">
        <!-- ...same as login.html... -->
    </nav>
    <main class="modern-auth-page">
        <div class="modern-auth-background">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="gradient-orb orb-3"></div>
        </div>
        <div class="container">
            <div class="modern-auth-container">
                <div class="modern-auth-split">
                    <div class="modern-auth-card">
                        <div class="auth-header">
                            <div class="auth-logo">
                                <div class="logo-glow"></div>
                                <span class="brand-name">BookPandit</span>
                            </div>
                            <h1 class="auth-title" data-i18n="forgotPassword">Forgot Password?</h1>
                            <p class="auth-subtitle" data-i18n="forgotPasswordDesc">Enter your email to receive a password reset link.</p>
                        </div>
                        <form class="modern-auth-form" id="forgot-password-form">
                            <div class="modern-form-group">
                                <div class="modern-input-group">
                                    <i class="fas fa-envelope input-icon"></i>
                                    <input type="email" id="forgot-email" name="email" placeholder="Email address" data-i18n-placeholder="emailAddress" required>
                                </div>
                            </div>
                            <button type="button" class="modern-login-btn" id="send-otp-btn">
                                <span data-i18n="sendOtp">Send OTP</span>
                            </button>
                            <div class="modern-auth-footer">
                                <a href="login.html" class="back-to-login" data-i18n="backToLogin">← Back to Login</a>
                            </div>
</head>
<script>
// Simple redirect for demo; replace with real OTP logic as needed
document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('send-otp-btn');
    if (btn) {
        btn.onclick = function() {
            // You can add email validation here if needed
            window.location.href = 'otp-verification.html';
        };
    }
});
</script>
                        </form>
                    </div>
                    <div class="modern-auth-visual">
                        <!-- ...same as login.html... -->
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
