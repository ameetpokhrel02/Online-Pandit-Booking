<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Book Pandit</title>
    <link rel="icon" type="image/png" href="images/logo/logo.png">
    <link rel="stylesheet" href="styles/styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/auth.js" defer></script>
</head>
<body class="modern-auth-body">
    <nav class="navbar">
        <!-- ...same as login.html... -->
    </nav>
    <main class="modern-auth-page">
        <div class="modern-auth-background">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="gradient-orb orb-3"></div>
        </div>
        <div class="container">
            <div class="modern-auth-container">
                <div class="modern-auth-split">
                    <div class="modern-auth-card">
                        <div class="auth-header">
                            <div class="auth-logo">
                                <div class="logo-glow"></div>
                                <span class="brand-name">BookPandit</span>
                            </div>
                            <h1 class="auth-title" data-i18n="resetPassword">Reset Password</h1>
                            <p class="auth-subtitle" data-i18n="resetPasswordDesc">Enter your new password below.</p>
                        </div>
                        <form class="modern-auth-form" id="reset-password-form">
                            <div class="modern-form-group">
                                <div class="modern-input-group">
                                    <i class="fas fa-lock input-icon"></i>
                                    <input type="password" id="new-password" name="new-password" placeholder="New Password" data-i18n-placeholder="newPassword" required>
                                </div>
                            </div>
                            <div class="modern-form-group">
                                <div class="modern-input-group">
                                    <i class="fas fa-lock input-icon"></i>
                                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" data-i18n-placeholder="confirmPassword" required>
                                </div>
                            </div>
                            <button type="submit" class="modern-login-btn">
                                <span data-i18n="updatePassword">Update Password</span>
                            </button>
                            <div class="modern-auth-footer">
                                <a href="login.html" class="back-to-login" data-i18n="backToLogin">← Back to Login</a>
                            </div>
                        </form>
                    </div>
                    <div class="modern-auth-visual">
                        <!-- ...same as login.html... -->
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
