<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandit Dashboard - Book Pandit</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <div class="logo-icon"></div>
                <a href="index.html" class="logo-text">Book<span>Pandit</span></a>
            </div>
            <div class="nav-links">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-profile">
                    <img src="images/logo/pandit.png" alt="Pandit Avatar" class="avatar">
                    <span class="username">Pandit</span>
                    <a href="login.html" class="btn btn-secondary">Logout</a>
                </div>
            </div>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <nav class="dashboard-nav">
                <a href="#overview" class="active"><i class="fas fa-home"></i> Overview</a>
                <a href="#bookings"><i class="fas fa-calendar-check"></i> My Bookings</a>
                <a href="#profile"><i class="fas fa-user"></i> Profile</a>
            </nav>
        </aside>

        <!-- Main Section -->
        <main class="dashboard-main">
            <section id="overview">
                <h2>Welcome, Pandit!</h2>
                <p>This is your dashboard. Here you can view your bookings, manage your profile, and more.</p>
            </section>
            <section id="bookings">
                <h2>My Bookings</h2>
                <table class="dashboard-table">
                  <thead>
                    <tr>
                      <th>Booking ID</th>
                      <th>Service</th>
                      <th>Date</th>
                      <th>Time</th>
                      <th>User</th>
                      <th>Notes</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="bookings-table-body">
                    <!-- Booking rows will be inserted here by JS -->
                  </tbody>
                </table>
            </section>
            <section id="profile">
                <h2>Profile</h2>
                <form id="pandit-profile-form" class="profile-form">
                  <div class="form-group">
                    <label for="pandit-name">Full Name</label>
                    <input type="text" id="pandit-name" name="pandit-name" value="Pandit Name" required>
                  </div>
                  <div class="form-group">
                    <label for="pandit-email">Email</label>
                    <input type="email" id="pandit-email" name="pandit-email" value="pandit@email.com" required>
                  </div>
                  <div class="form-group">
                    <label for="pandit-bio">Bio</label>
                    <textarea id="pandit-bio" name="pandit-bio" rows="3">Experienced Pandit for all rituals.</textarea>
                  </div>
                  <div class="form-group">
                    <label for="pandit-skills">Skills</label>
                    <input type="text" id="pandit-skills" name="pandit-skills" value="Marriage, Griha Pravesh, Puja">
                  </div>
                  <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
            </section>
        </main>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Book Pandit. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
    // Connect to Django backend and show a message
    fetch('http://127.0.0.1:8000/api/hello/')
      .then(response => response.json())
      .then(data => {
        const msgDiv = document.createElement('div');
        msgDiv.textContent = 'Backend says: ' + data.message;
        msgDiv.style.background = '#e6ffe6';
        msgDiv.style.color = '#222';
        msgDiv.style.padding = '10px';
        msgDiv.style.margin = '20px auto';
        msgDiv.style.textAlign = 'center';
        msgDiv.style.maxWidth = '400px';
        document.body.insertBefore(msgDiv, document.body.firstChild);
      })
      .catch(err => console.log('Backend not reachable:', err));

    // --- Pandit Dashboard Integration ---
    // Replace with actual logged-in pandit username (for demo, prompt)
    // Improved authentication: check login state
    let user = null;
    try {
      user = JSON.parse(localStorage.getItem('user'));
    } catch (e) {}
    if (!user || user.role !== 'pandit') {
      window.location.href = 'login.html';
    }
    const panditUsername = user.username;
    // Show Pandit name in navbar
    document.querySelector('.user-profile .username').textContent = user.username;
    // Logout button
    document.querySelector('.user-profile .btn.btn-secondary').addEventListener('click', function(e) {
      e.preventDefault();
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    });

    // Fetch bookings for this Pandit
    async function fetchBookings() {
      const tbody = document.getElementById('bookings-table-body');
      tbody.innerHTML = '';
      // Show loading
      const loadingTr = document.createElement('tr');
      loadingTr.innerHTML = `<td colspan='6'>Loading...</td>`;
      tbody.appendChild(loadingTr);
      const res = await fetch(`http://127.0.0.1:8000/api/pandit/bookings/?pandit=${panditUsername}`);
      const data = await res.json();
      tbody.innerHTML = '';
      if (data.bookings && data.bookings.length > 0) {
        data.bookings.forEach(b => {
          let actionBtns = '';
          if (b.status === 'pending') {
            actionBtns = `<button class='btn btn-secondary btn-sm' onclick="updateBookingStatus(${b.id}, 'confirmed')">Accept</button>
                          <button class='btn btn-danger btn-sm' onclick="updateBookingStatus(${b.id}, 'rejected')">Reject</button>`;
          } else if (b.status === 'confirmed') {
            actionBtns = `<button class='btn btn-success btn-sm' onclick="updateBookingStatus(${b.id}, 'completed')">Complete</button>`;
          }
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${b.id}</td><td>${b.service}</td><td>${b.date}</td><td>${b.time}</td><td>${b.user.full_name} (${b.user.email})</td><td>${b.ceremony_notes || ''}</td><td>${b.status}</td><td>${actionBtns}</td>`;
          tbody.appendChild(tr);
        });
      } else {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan='6'>No bookings found.</td>`;
        tbody.appendChild(tr);
      }
    }
    fetchBookings();

    // Update booking status
    window.updateBookingStatus = async function(bookingId, status) {
      const res = await fetch('http://127.0.0.1:8000/api/pandit/booking-status/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ booking_id: bookingId, status })
      });
      const data = await res.json();
      alert(data.message || data.error);
      fetchBookings();
    }

    // Profile form handler
    document.getElementById('pandit-profile-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('pandit-email').value;
      const name = document.getElementById('pandit-name').value;
      // For demo, split name into first/last
      const [first_name, ...lastArr] = name.split(' ');
      const last_name = lastArr.join(' ');
      const res = await fetch('http://127.0.0.1:8000/api/pandit/profile/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: panditUsername, email, first_name, last_name })
      });
      const data = await res.json();
      alert(data.message || data.error);
    });
    </script>
</body>
</html>
